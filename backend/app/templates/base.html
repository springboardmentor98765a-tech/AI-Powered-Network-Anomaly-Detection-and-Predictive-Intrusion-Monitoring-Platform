<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · Network Anomaly Platform</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Network Anomaly<span>Detection &amp; Intrusion Monitoring</span></div>
    <nav>
      {% for item in nav %}
        {% if item.ready %}
          <a href="{{ item.href }}" class="{{ 'active' if item.href == active else '' }}">{{ item.label }}</a>
        {% else %}
          <span class="disabled" title="Page not built yet">{{ item.label }}</span>
        {% endif %}
      {% endfor %}
    </nav>
  </aside>
  <main>
    <header class="topbar">
      <div class="who"><strong>{{ user.name }}</strong><span class="badge">{{ role_label }}</span></div>
      <form method="post" action="/logout"><button class="btn" type="submit">Log out</button></form>
    </header>
    <div class="content">{% block content %}{% endblock %}</div>
  </main>
</body>
</html>
